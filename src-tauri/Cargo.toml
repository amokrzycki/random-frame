[package]
name = "random-frame"
version = "0.5.0"
description = "Random public images, one frame at a time"
authors = ["Adrian Mokrzycki"]
license = "MIT"
repository = "https://github.com/amokrzycki/random-frame"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "random_frame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time", "sync"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.2", default-features = false, features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.2", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Panic paths and diagnostics that should never reach production unnoticed.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Selected nursery lints: useful ownership, allocation, iterator, and async checks.
collection_is_never_read = "warn"
future_not_send = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
unused_peekable = "warn"

# Selected restriction lints. The full group is intentionally too noisy.
allow_attributes_without_reason = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
rc_mutex = "warn"
unused_result_ok = "warn"

# Kept explicit so the performance policy is visible even when group contents change.
clone_on_copy = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
large_enum_variant = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
manual_memcpy = "warn"
map_clone = "warn"
match_same_arms = "warn"
needless_borrow = "warn"
needless_borrowed_reference = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_to_owned = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
wildcard_imports = "warn"
