name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Rust fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --all-features

      - name: Tauri build
        run: npx tauri build --no-bundle

  # Every PR: the Android build compiles, keeps its permissions, ABIs and 16 KB alignment.
  android:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/android-setup

      - name: Android ARM64 debug build
        run: npx tauri android build --debug --target aarch64 --apk --ci

      - name: Check APK
        run: |
          .github/tools/check-android-apk.sh \
            src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk debug arm64-v8a

      - name: Rust clippy (Android)
        run: |
          bin="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android24-clang" AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android24-clang"
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android --lib -- -D warnings

  # Main only: the app starts, handles Back and keeps its Sync secret on a 16 KB page-size emulator.
  android-smoke:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/android-setup

      - uses: ./.github/actions/android-smoke
