name: Android emulator smoke test
description: >
  Builds an x86_64 debug APK of the checked-out commit against a local Sync mock and runs
  .github/tools/android-smoke.mjs on a 16 KB page-size emulator. Run android-setup first.
runs:
  using: composite
  steps:
    - name: Build x86_64 debug APK
      shell: bash
      env:
        RANDOM_FRAME_SYNC_BASE_URL: http://127.0.0.1:8787
      run: npx tauri android build --debug --target x86_64 --apk --ci

    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Start 16 KB emulator
      shell: bash
      run: |
        image="system-images;android-35;google_apis_ps16k;x86_64"
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
        emulator="$ANDROID_HOME/emulator/emulator"
        adb="$ANDROID_HOME/platform-tools/adb"
        log="$RUNNER_TEMP/emulator.log"
        export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
        mkdir -p "$ANDROID_AVD_HOME"

        yes 2>/dev/null | "$sdkmanager" --licenses > /dev/null || true
        "$sdkmanager" emulator platform-tools "$image" > /dev/null
        echo no | "$avdmanager" create avd -n smoke -k "$image" -d pixel_6 --force

        "$adb" start-server > /dev/null
        # First boot still killed the foreground app at 4 GB; give the 16 KB image more headroom.
        nohup "$emulator" -avd smoke -no-window -no-audio -no-boot-anim -no-snapshot \
          -memory 6144 -gpu swiftshader_indirect > "$log" 2>&1 &
        emulator_pid=$!

        deadline=$((SECONDS + 600))
        booted=false
        ready_since=$SECONDS
        system_server_pid=""
        while (( SECONDS < deadline )); do
          if ! kill -0 "$emulator_pid" 2>/dev/null; then
            emulator_status=0
            wait "$emulator_pid" || emulator_status=$?
            echo "::error::Android emulator exited before boot (status $emulator_status)"
            cat "$log"
            exit 1
          fi

          if [ "$("$adb" get-state 2>/dev/null || true)" = "device" ] &&
             [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] &&
             [ "$("$adb" shell getprop init.svc.bootanim 2>/dev/null | tr -d '\r')" = "stopped" ] &&
             "$adb" shell pm path android > /dev/null 2>&1 &&
             [ "$("$adb" shell service check activity 2>/dev/null | tr -d '\r')" = "Service activity: found" ]; then
            current_pid=$("$adb" shell pidof system_server 2>/dev/null || true)
            # boot_completed can precede first-boot pressure or survive a system-server restart.
            # Require working services and the same system server for 30 seconds before installing.
            if [ -n "$current_pid" ] && [ "$current_pid" = "$system_server_pid" ]; then
              if (( SECONDS - ready_since >= 30 )); then
                booted=true
                break
              fi
            else
              ready_since=$SECONDS
            fi
            system_server_pid="$current_pid"
          else
            ready_since=$SECONDS
            system_server_pid=""
          fi
          sleep 5
        done

        if [ "$booted" != "true" ]; then
          echo "::error::Android emulator did not finish booting within 600 seconds"
          cat "$log"
          exit 1
        fi

    - name: Smoke test
      shell: bash
      run: |
        node .github/tools/android-smoke.mjs \
          src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk --page-size 16384
